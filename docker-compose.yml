# Local development stack: SQL Server + API.
#   docker compose up --build
# API: http://localhost:5080  (OpenAPI document at /openapi/v1.json)
# The passwords and keys below are for local development only.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ClinicHub_Dev#2026"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/ClinicHub.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ClinicHub: "Server=sqlserver,1433;Database=ClinicHub;User Id=sa;Password=ClinicHub_Dev#2026;TrustServerCertificate=True"
    ports:
      - "5080:8080"

volumes:
  sqldata:
